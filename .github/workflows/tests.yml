name: tests

# PCMode is a native .NET/WPF application, so it builds and tests only on
# Windows. Nothing in the test suite needs a display, a TV, an audio endpoint,
# an application, or a controller: every Windows/network boundary is behind a
# fakeable interface, and the tests exercise the engine against fakes.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: dotnet test on Windows
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore app/PCMode.slnx

      - name: Build
        run: dotnet build app/PCMode.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test app/PCMode.slnx --no-build --configuration Release --logger "console;verbosity=normal"
